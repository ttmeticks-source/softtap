name: Build Smash Simulator (macOS)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show macOS Swift toolchain
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build universal app for macOS 11+
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify app and archive
        run: |
          test -d "dist/Smash Simulator.app"
          test -s "dist/Smash-Simulator-macOS.zip"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "dist/Smash Simulator.app/Contents/Info.plist"
          unzip -tq "dist/Smash-Simulator-macOS.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smash-Simulator-macOS
          path: dist/Smash-Simulator-macOS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest curl download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smash Simulator build ${{ github.run_number }} (macOS 11+)
          target_commitish: main
          body: "Universal Intel and Apple Silicon app. Minimum supported version: macOS 11 Big Sur."
          files: dist/Smash-Simulator-macOS.zip
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
